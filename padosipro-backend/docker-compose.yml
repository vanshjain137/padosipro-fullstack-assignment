version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: padosi_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: padosidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Mailpit - Local Email Catcher
  mailpit:
    image: axllent/mailpit
    container_name: padosi_mailpit
    ports:
      - "8025:8025" 
      - "1025:1025" 

volumes:
  postgres_data: